<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Shape Morph</title>
<style>
/*@FONTS@*/
html,body{margin:0;background:#ECEAE6}
#frame{position:relative;width:1440px;height:1440px;overflow:hidden;background:#ECEAE6;
  font-family:'Geist','Heebo',sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
#world{position:absolute;left:720px;top:720px;transform-origin:0 0}
#shape{position:absolute;overflow:hidden;transform-origin:50% 50%}
#content{position:absolute;left:0;top:0;width:0;height:0}
.a{position:absolute;white-space:nowrap}
.r{text-align:right;direction:rtl}
.c{text-align:center;direction:rtl}
.row{display:flex;align-items:center;justify-content:center;direction:rtl}
svg{display:block;overflow:visible}
#cursor{position:absolute;left:0;top:0;width:44px;height:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
</style>
</head>
<body>
<div id="frame"><div id="world"><div id="shape"><div id="content"></div></div></div></div>
<script>
'use strict';
/* =====================================================================
   One shape, one timeline. Every style below is a pure function of t,
   computed inside seek(t). No CSS transitions, no timers, no state.
   120 BPM, 7 bars = 28 beats = 14 s. t=0 is a downbeat; seek(14) === seek(0).
   ===================================================================== */
const T = 14;
const INK = [10, 10, 10], PAPER = [255, 255, 255];

/* ---------- springs: closed-form step responses ---------- */
const SP = {
  morph:  { w: 16, z: 0.82 },   // ~1% overshoot, the only overshoot we allow
  soft:   { w: 12, z: 0.9 },
  color:  { w: 16, z: 1 },
  flip:   { w: 22, z: 1 },
  snap:   { w: 400, z: 1 },
  wash:   { w: 11, z: 1 },
  enter:  { w: 26, z: 1 },
  exit:   { w: 34, z: 1 },
  cursor: { w: 16, z: 1 },
  cursorY:{ w: 13, z: 1 },     // different y stiffness bends cursor paths into arcs
  drag:   { w: 9,  z: 1 },
  cam:    { w: 6.5, z: 1 },
  lead:   { w: 28, z: 0.86 },   // liquid leading edge
  trail:  { w: 13, z: 0.95 },   // liquid trailing edge
  release:{ w: 20, z: 0.8 },
  press:  { w: 42, z: 1 },
  fast:   { w: 24, z: 0.86 },
  draw:   { w: 14, z: 1 },
  line:   { w: 6.5, z: 1 },
  key:    { w: 44, z: 1 },
};

// unit step response of a mass-spring-damper released at tau = 0
function S(tau, sp) {
  if (tau <= 0) return 0;
  const { w, z } = sp;
  if (z >= 1) return 1 - Math.exp(-w * tau) * (1 + w * tau);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
// homogeneous response: displacement A and velocity v0 at tau = 0
function F(tau, A, v0, sp) {
  if (tau < 0) tau = 0;
  const { w, z } = sp;
  if (z >= 1) return Math.exp(-w * tau) * (A + (v0 + w * A) * tau);
  const wd = w * Math.sqrt(1 - z * z);
  return Math.exp(-z * w * tau) * (A * Math.cos(wd * tau) + ((v0 + z * w * A) / wd) * Math.sin(wd * tau));
}
/* A value that changes target many times is the sum of one spring per change.
   periodic: the value before the first key is the last key's value and the
   previous cycle's springs are added too, so value(0) === value(T) with equal velocity. */
function track(keys, sp0, periodic = true) {
  const k = keys.map(([t, v, sp]) => [t, v, sp || sp0]);
  const n = k.length;
  const base = periodic ? k[n - 1][1] : k[0][1];
  const d = k.map((e, i) => e[1] - (i ? k[i - 1][1] : base));
  return t => {
    let v = base;
    for (let i = 0; i < n; i++) {
      if (!d[i]) continue;
      v += d[i] * S(t - k[i][0], k[i][2]);
      if (periodic) v += d[i] * S(t - k[i][0] + T, k[i][2]);
    }
    return v;
  };
}
// released at t0 from (x0, v0): free response toward keys[0] plus one step per later key
function releaseFrom(t, t0, x0, v0, keys, sp0) {
  const k = keys.map(([kt, v, sp]) => [kt, v, sp || sp0]);
  let v = k[0][1] + F(t - t0, x0 - k[0][1], v0, k[0][2]);
  for (let i = 1; i < k.length; i++) v += (k[i][1] - k[i - 1][1]) * S(t - k[i][0], k[i][2]);
  return v;
}
const vel = (f, t) => (f(t) - f(t - 1e-3)) / 1e-3;
// content window: its own enter and exit spring, evaluated around the loop seam
function win(t, tin, tout, spIn = SP.enter, spOut = SP.exit) {
  let best = 0;
  for (const o of [-T, 0, T]) {
    const u = t + o;
    const v = S(u - tin, spIn) * (1 - S(u - tout, spOut));
    if (v > best) best = v;
  }
  return Math.min(1, best);
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, u) => a + (b - a) * u;
const rgb = (c, u, a = 1) => `rgba(${Math.round(mix(INK[0], PAPER[0], u))},${Math.round(mix(INK[1], PAPER[1], u))},${Math.round(mix(INK[2], PAPER[2], u))},${a})`;

/* ---------- icons: one stroke weight in world px for every glyph ---------- */
const STROKE = 2.4;
const ICON = {
  download: '<path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 19.5h14"/>',
  check: '<path pathLength="1" d="M5.5 12.5l4.2 4.2L18.5 7.8"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  volLow: '<path d="M4 9.5h3.5L12 5.8v12.4l-4.5-3.7H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/>',
  volHigh: '<path d="M4 9.5h3.5L12 5.8v12.4l-4.5-3.7H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.3 6.8a7.3 7.3 0 0 1 0 10.4"/>',
  moon: '<path d="M19.5 14.5A8 8 0 1 1 9.5 4.5a6.2 6.2 0 0 0 10 10z"/>',
  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4.2l2.8 1.8"/>',
  sliders: '<path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/>',
  music: '<path d="M9 17.5V6.2l10-2v11"/><circle cx="6.6" cy="17.5" r="2.4"/><circle cx="16.6" cy="15.2" r="2.4"/>',
  done: '<circle cx="12" cy="12" r="8.5"/><path d="M8.6 12.3l2.3 2.3 4.5-4.8"/>',
  enter: '<path d="M18.5 6v5a3 3 0 0 1-3 3H6"/><path d="M9.5 10.5L6 14l3.5 3.5"/>',
  cmd: '<path d="M9 6.5a2.5 2.5 0 1 0-2.5 2.5h11A2.5 2.5 0 1 0 15 6.5v11a2.5 2.5 0 1 0 2.5-2.5h-11A2.5 2.5 0 1 0 9 17.5z"/>',
  next: '<path d="M6 6.5l9 5.5-9 5.5z" fill="currentColor"/><path d="M18 6.5v11"/>',
  prev: '<path d="M18 6.5l-9 5.5 9 5.5z" fill="currentColor"/><path d="M6 6.5v11"/>',
  ring: '<circle cx="12" cy="12" r="9"/>',
};
const icon = (name, size) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${(STROKE * 24 / size).toFixed(3)}" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;

/* ---------- DOM (built once; seek() only writes styles) ---------- */
const world = document.getElementById('world');
const shape = document.getElementById('shape');
const content = document.getElementById('content');
function E(parent, css = '', html = '', cls = 'a') {
  const e = document.createElement('div');
  e.className = cls; if (css) e.style.cssText = css; if (html) e.innerHTML = html;
  parent.appendChild(e); return e;
}
// place an element centred on world (x, y)
function box(e, x, y, w, h) {
  const s = e.style;
  s.left = (x - w / 2) + 'px'; s.top = (y - h / 2) + 'px'; s.width = w + 'px'; s.height = h + 'px';
}
// right-aligned text whose right edge sits at world xr
function boxR(e, xr, y, w, h) { box(e, xr - w / 2, y, w, h); }
// visibility with a short blur; o in [0,1]
function show(e, o, { blur = 8, dy = 4, sc = 1, extra = '' } = {}) {
  const s = e.style;
  if (o < 0.003) { s.visibility = 'hidden'; s.opacity = 0; s.filter = 'none'; s.transform = 'none'; return false; }
  s.visibility = 'visible';
  s.opacity = o.toFixed(4);
  const b = (1 - o) * blur;
  s.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none';
  s.transform = `translateY(${((1 - o) * dy).toFixed(2)}px) scale(${((0.965 + 0.035 * o) * sc).toFixed(4)})${extra}`;
  return true;
}
const font = (e, size, weight, color) => { e.style.fontSize = size + 'px'; e.style.fontWeight = weight; if (color) e.style.color = color; };

/* ---------------- timeline data ---------------- */
// shape geometry, keyed on the beat grid (seconds)
const shapeW = track([[0, 96], [2, 380], [2.5, 600], [4.5, 580], [6.5, 150], [7.5, 540], [9, 660], [10.5, 460], [11, 600], [12.5, 460], [13.5, 300]], SP.morph);
const shapeH = track([[0, 96], [2, 76], [2.5, 340], [4.5, 80], [6.5, 84], [9, 500], [10.5, 80], [11, 376], [11.5, 264], [11.625, 208], [12, 152], [12.5, 80], [13.5, 84]], SP.morph);
const shapeCY = track([[0, 0], [11, 0], [11.5, -56], [11.625, -84], [12, -112], [12.5, 0]], SP.morph); // palette keeps its top edge
const shapeR = track([[0, 48], [2, 38], [2.5, 40], [4.5, 40], [6.5, 42], [9, 36], [10.5, 40], [11, 28], [12.5, 40], [13.5, 42]], SP.morph);
const shapeC = track([[0, 0], [4.86, 1], [7.36, 0], [10.86, 1], [12.86, 0]], SP.snap);   // snaps under a wash     // 0 ink, 1 paper
const shapePress = track([[0, 0], [2.43, 1], [2.5, 0], [10.93, 1], [11, 0], [13.93, 1]], SP.press);

// camera: zoom so each state fills the frame, lags the morph a little
const camZ = track([[0, 5.0], [1.9, 2.35], [2.4, 1.62], [4.5, 1.72], [6.5, 3.4], [7.38, 1.9], [8.88, 1.45], [10.5, 2.05], [10.9, 1.58], [11.5, 1.75], [12, 1.95], [12.5, 2.15], [13.5, 2.95]], SP.cam);
const camY = track([[0, 0], [11, 0], [11.5, -56], [11.625, -84], [12, -112], [12.5, 0]], SP.cam);

// chart data (RTL: Sunday on the right)
const DAYS = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
const VALS = [980, 1284, 1120, 1690, 2140, 1560, 1870];
const CX = i => 280 - i * (560 / 6);
const CY = v => 176 - (v - 600) / 1700 * 196;
const PTS = VALS.map((v, i) => [CX(i), CY(v)]);

// cursor: sum of springs on x and y; every click and drag below is driven by it
const CUR = [
  [0.10, 150, 118],
  [2.05, 40, 6],
  [2.62, 2, 114],
  [3.08, -100, 17],
  [3.70, 156, 22, SP.drag],       // scrub
  [4.60, -19, 3],
  [5.12, 380, 8, SP.drag],        // volume, dragged past max
  [6.10, 50, 22],
  [7.12, 4, 6],
  [8.08, 176, 6],
  [8.62, PTS[1][0] + 4, PTS[1][1] + 10],
  [9.80, PTS[4][0] + 4, PTS[4][1] + 10],
  [10.55, 60, 6],
  [11.10, 340, 170],
  [12.62, 236, 150],
  [13.40, 24, 12],
];
const curX = track(CUR.map(c => [c[0], c[1], c[3] || SP.cursor]), SP.cursor);
const curY = track(CUR.map(c => [c[0], c[2], c[3] ? SP.drag : SP.cursorY]), SP.cursorY);
const curPress = track([[0, 0], [2.43, 1], [2.5, 0], [2.93, 1], [3, 0], [3.5, 1], [4.5, 0], [5, 1], [6, 0], [6.93, 1], [7, 0], [7.93, 1], [8, 0], [8.43, 1], [8.5, 0], [10.93, 1], [11, 0], [13.93, 1]], SP.press);

/* ---- progress / volume knob: direct manipulation while held ---- */
const TRK_L = track([[2.5, -268], [4.5, -212]], SP.morph, false);
const TRK_R0 = track([[2.5, 268], [4.5, 212]], SP.morph, false);
const TRK_Y = track([[2.5, 14], [4.5, 0]], SP.morph, false);
const TRK_H = track([[2.5, 6], [4.5, 10]], SP.morph, false);
const DUR = 204;                                          // 3:24
const pPlay = t => 0.30 + (t > 3 ? 0.03 * (t - 3) : 0);  // playing after the click at 3.0
const VOL0 = 0.45, VMAX = 212;
const rubber = over => 64 * (1 - Math.exp(-over / 100));
const kxPlay = t => -268 + 536 * pPlay(t);
const SCRUB_OFF = kxPlay(3.5) - curX(3.5);
const kxScrub = t => -268 + 536 * clamp((curX(t) + SCRUB_OFF + 268) / 536);
const XR1 = kxScrub(4.5), VR1 = vel(kxScrub, 4.5);
const kxSettle = t => releaseFrom(t, 4.5, XR1, VR1, [[4.5, -212 + 424 * VOL0]], SP.release);
const VOL_OFF = kxSettle(5) - curX(5);
const kxVol = t => {
  const raw = curX(t) + VOL_OFF;
  return raw <= VMAX ? Math.max(raw, -212) : VMAX + rubber(raw - VMAX);
};
const XR2 = kxVol(6), VR2 = vel(kxVol, 6);
const KD = track([[2.5, 16], [3.5, 26, SP.fast], [4.5, 30], [5, 38, SP.fast], [6, 30, SP.fast], [6.5, 68]], SP.morph, false);
const kxBefore6 = t => t < 3.5 ? kxPlay(t) : t < 4.5 ? kxScrub(t) : t < 5 ? kxSettle(t) : kxVol(t);
const LR0 = kxBefore6(6) - KD(6) / 2, VL0 = vel(t => kxBefore6(t) - KD(t) / 2, 6);
const RR0 = kxBefore6(6) + KD(6) / 2, VRR0 = vel(t => kxBefore6(t) + KD(t) / 2, 6);
// after release the two edges ride different springs: the leading edge stretches ahead
const TAB = 524 / 3, TABX = [TAB, 0, -TAB];               // שבוע | חודש | שנה  (right to left)
const LKEYS = [[6, VMAX - 15, SP.release], [6.5, -1, SP.morph], [6.93, -12, SP.fast], [7, -67, SP.lead], [7.5, -262, SP.morph], [8, -TAB / 2, SP.trail], [8.5, TAB / 2, SP.trail]];
const RKEYS = [[6, VMAX + 15, SP.release], [6.5, 67, SP.morph], [7, 1, SP.trail], [7.5, -TAB / 2, SP.morph], [8, TAB / 2, SP.lead], [8.5, 262, SP.lead]];
const knobL = t => t < 6 ? kxBefore6(t) - KD(t) / 2 : releaseFrom(t, 6, LR0, VL0, LKEYS);
const knobR = t => t < 6 ? kxBefore6(t) + KD(t) / 2 : releaseFrom(t, 6, RR0, VRR0, RKEYS);
const KY = track([[2.5, 14], [4.5, 0], [9, -184]], SP.morph, false);
const KC = track([[2.5, 1], [4.5, 0, SP.snap]], SP.color, false);
const TRKC = track([[2.5, 0], [4.5, 1]], SP.snap, false);          // track palette flips with the wash       // knob colour, 1 = paper
const stretch = t => (t >= 5 && t < 6.6) ? Math.max(0, (knobL(t) + knobR(t)) / 2 - VMAX) : 0;

const playPause = track([[0, 0], [3, 1]], SP.fast, false);
const playPress = track([[0, 0], [2.93, 1], [3, 0]], SP.press, false);
const loaderP = track([[0, 0], [0.04, 0.32, SP.soft], [0.5, 0.63, SP.soft], [1, 0.86, SP.soft], [1.5, 1, SP.soft]], SP.soft, false);
const tabsY = track([[7.5, 0], [9, -184]], SP.morph, false);
const hoverX = track([[9.5, PTS[1][0]], [10, PTS[4][0]]], SP.fast, false);
const hoverY = track([[9.5, PTS[1][1]], [10, PTS[4][1]]], SP.fast, false);
const titleS = track([[2, 22 / 30], [2.5, 1]], SP.morph, false);
const titleX = track([[2, 116], [2.5, 144]], SP.morph, false);
const titleY = track([[2, 0], [2.5, -106]], SP.morph, false);
const artX = track([[2, 152], [2.5, 216]], SP.morph, false);
const artY = track([[2, 0], [2.5, -86]], SP.morph, false);
const artS = track([[2, 52], [2.5, 104]], SP.morph, false);
const artR = track([[2, 14], [2.5, 22]], SP.morph, false);
const KEYS_T = [11.5, 11.625, 11.75, 11.875, 12.0];
const TYPED = ['ה', 'ו', 'ר', 'ד', 'ה'];
const ROWS = [
  ['download', 'הורדה חדשה', 12.5],
  ['clock', 'הורדות אחרונות', 12.0],
  ['sliders', 'הגדרות שמע', 11.625],
  ['music', 'חיפוש שירים', 11.5],
  ['moon', 'מצב לילה', 11.5],
];
const enterPress = track([[0, 0], [12.44, 1], [12.5, 0]], SP.press, false);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

/* ---------------- elements ---------------- */
// colour washes: the new colour spreads from where the interaction happened,
// then the shape's own colour snaps underneath it; never a grey frame
const WASH = [[4.5, 0, 14, '#fff'], [10.5, 0, 0, '#fff'], [12.5, 0, -72, '#0A0A0A']];
const washEls = WASH.map(([, , , col]) => E(content, `background:${col};border-radius:50%`));
// button
const btn = E(content, 'color:#fff;gap:12px', `${icon('download', 28)}<span style="font-size:28px;font-weight:500;line-height:1">הורדה</span>`, 'a row');
// loader
const loader = E(content, '', `<svg width="96" height="96" viewBox="-48 -48 96 96" fill="none">
  <circle r="30" stroke="rgba(255,255,255,.18)" stroke-width="${STROKE}"/>
  <g id="ringG"><circle id="ringArc" r="30" stroke="#fff" stroke-width="${STROKE}" stroke-linecap="round" pathLength="1"/></g></svg>`);
const ringG = loader.querySelector('#ringG'), ringArc = loader.querySelector('#ringArc');
const loaderCheck = E(content, 'color:#fff', icon('check', 34));
const loaderCheckPath = loaderCheck.querySelector('path');
// album art: pure black and white, a sun over the sea
const art = E(content, 'background:#fff;overflow:hidden', `<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
  <circle cx="50" cy="54" r="22" fill="#0A0A0A"/><rect x="0" y="58" width="100" height="42" fill="#fff"/>
  <rect x="18" y="64" width="64" height="4" rx="2" fill="#0A0A0A"/><rect x="28" y="74" width="44" height="4" rx="2" fill="#0A0A0A"/><rect x="38" y="84" width="24" height="4" rx="2" fill="#0A0A0A"/></svg>`);
const title = E(content, 'color:#fff;font-size:30px;font-weight:600;line-height:40px;transform-origin:100% 50%', 'שקיעה בים', 'a r');
const bars = E(content, '', '');
const barEls = [0, 1, 2, 3, 4].map(i => E(bars, 'background:#fff;border-radius:2px;width:4px'));
const artist = E(content, 'color:rgba(255,255,255,.55);font-size:19px;font-weight:400;line-height:28px', 'קולקטיב חוף', 'a r');
const doneIc = E(content, 'color:rgba(255,255,255,.55)', icon('done', 28));
const tNow = E(content, 'color:rgba(255,255,255,.55);font-size:15px;line-height:20px;text-align:left', '');
const tEnd = E(content, 'color:rgba(255,255,255,.55);font-size:15px;line-height:20px;text-align:right', '');
const prevIc = E(content, 'color:#fff', icon('prev', 30));
const nextIc = E(content, 'color:#fff', icon('next', 30));
const playBtn = E(content, 'background:#fff;border-radius:50%;color:#0A0A0A;display:flex;align-items:center;justify-content:center',
  `<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="${(STROKE * 24 / 30).toFixed(3)}" stroke-linejoin="round"><path id="pp1"/><path id="pp2"/></svg>`);
const pp1 = playBtn.querySelector('#pp1'), pp2 = playBtn.querySelector('#pp2');
// track, fill, knob (one knob: progress thumb -> volume thumb -> toggle knob -> tab indicator)
const trk = E(content, '');
const fill = E(content, '');
const volLo = E(content, 'color:#0A0A0A', icon('volLow', 28));
const volHi = E(content, 'color:#0A0A0A', icon('volHigh', 28));
const tabsBg = E(content, 'background:rgba(255,255,255,.09)');
const flood = E(content, 'background:#0A0A0A;border-radius:50%');
const knob = E(content, 'overflow:hidden');
const moonPaper = E(knob, 'color:#fff', icon('moon', 28));
const iris = E(knob, 'background:#fff;overflow:hidden');
const moonInk = E(iris, 'color:#0A0A0A', icon('moon', 28));
const TABS = ['שבוע', 'חודש', 'שנה'];
const tabLite = E(content, '');
const tabInk = E(content, '');
[[tabLite, 'rgba(255,255,255,.62)'], [tabInk, '#0A0A0A']].forEach(([layer, col]) =>
  TABS.forEach((s, i) => E(layer, `left:${TABX[i] - TAB / 2 + 270}px;top:0;width:${TAB}px;height:84px;color:${col};font-size:21px;font-weight:500;line-height:84px`, s, 'a c')));
// chart
const chartHead = E(content, 'color:rgba(255,255,255,.55);font-size:17px;line-height:24px', 'האזנות השבוע', 'a r');
const chartNum = E(content, 'color:#fff;font-size:46px;font-weight:600;line-height:52px;letter-spacing:-1px', '9,814', 'a r');
const chartSvg = E(content, '', (() => {
  let d = `M${PTS[0][0]},${PTS[0][1]}`;
  for (let i = 0; i < PTS.length - 1; i++) {
    const p0 = PTS[i - 1] || PTS[i], p1 = PTS[i], p2 = PTS[i + 1], p3 = PTS[i + 2] || p2;
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
  }
  const grid = [-20, 78, 176].map(y => `<line x1="-290" x2="290" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.1)" stroke-width="1"/>`).join('');
  return `<svg width="600" height="300" viewBox="-300 -80 600 300" fill="none">${grid}
    <line id="guide" x1="0" x2="0" y1="-20" y2="176" stroke="rgba(255,255,255,.28)" stroke-width="1"/>
    <path id="line" d="${d}" stroke="#fff" stroke-width="${STROKE}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
    <circle id="dot" r="7" fill="#fff" stroke="#0A0A0A" stroke-width="3"/></svg>`;
})());
const cLine = chartSvg.querySelector('#line'), cGuide = chartSvg.querySelector('#guide'), cDot = chartSvg.querySelector('#dot');
const dayLbl = DAYS.map(s => E(content, 'color:rgba(255,255,255,.42);font-size:15px;line-height:20px', s, 'a c'));
const tip = E(content, 'background:#fff;border-radius:12px;color:#0A0A0A');
const tipTxt = [['1,284', 9.5, 10.0], ['2,140', 10.0, 99]].map(([n]) =>
  E(tip, 'left:0;top:0;width:100%;height:100%;font-size:16px;font-weight:600;line-height:40px', `${n} האזנות`, 'a c'));
// command palette
const srch = E(content, 'color:#0A0A0A', icon('search', 26));
const placeholder = E(content, 'color:rgba(10,10,10,.4);font-size:22px;line-height:32px', 'חיפוש…', 'a r');
const kcap = E(content, 'border:1px solid rgba(10,10,10,.14);border-radius:9px;color:rgba(10,10,10,.55);display:flex;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:500;direction:ltr',
  `${icon('cmd', 15)}<span>K</span>`);
const typed = E(content, 'color:#0A0A0A;font-size:22px;line-height:32px', '', 'a r');
const typedCh = TYPED.map(c => { const s = document.createElement('span'); s.textContent = c; s.style.display = 'inline-block'; typed.appendChild(s); return s; });
const caret = document.createElement('span');
caret.style.cssText = 'display:inline-block;width:2px;height:26px;background:#0A0A0A;vertical-align:-5px;margin-right:2px';
typed.appendChild(caret);
const divider = E(content, 'background:rgba(10,10,10,.08);height:1px');
const rows = ROWS.map(([ic, label], i) => {
  const r = E(content, `border-radius:14px;${i === 0 ? 'background:#0A0A0A;color:#fff' : 'color:#0A0A0A'}`);
  E(r, 'right:18px;top:12px', icon(ic, 26));
  E(r, 'right:58px;top:0;font-size:19px;font-weight:500;line-height:52px', label, 'a r');
  if (i === 0) r.enterCap = E(r, 'left:12px;top:11px;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center', icon('enter', 18));
  return r;
});
// toast
const toastIc = E(content, 'color:#fff', `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${(STROKE * 24 / 28).toFixed(3)}" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" stroke-opacity=".35"/><path pathLength="1" d="M8.4 12.3l2.5 2.5 4.8-5"/></svg>`);
const toastCheck = toastIc.querySelector('path');
const toastTxt = E(content, 'color:#fff;font-size:23px;font-weight:500;line-height:32px', 'ההורדה נשמרה', 'a r');
// cursor (screen space, constant size)
const cursor = E(document.getElementById('frame'), '', `<svg width="44" height="44" viewBox="0 0 32 32"><path d="M6 3.5v21.2l5.3-5.1 3.6 8.2 3.5-1.5-3.5-8h7.4z" fill="#0A0A0A" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg>`);
cursor.id = 'cursor';
const HOT = [6 * 44 / 32, 3.5 * 44 / 32];

/* ================= seek(t): everything from time ================= */
function seek(tIn) {
  const t = ((tIn % T) + T) % T;

  // ---- shape ----
  const st = stretch(t);
  const w = shapeW(t) + st, h = shapeH(t) - 0.16 * st;
  const cx = st / 2, cy = shapeCY(t);
  const r = Math.min(shapeR(t), w / 2, h / 2);
  const c = clamp(shapeC(t));
  const ss = shape.style;
  ss.left = (cx - w / 2) + 'px'; ss.top = (cy - h / 2) + 'px';
  ss.width = w + 'px'; ss.height = h + 'px'; ss.borderRadius = r + 'px';
  ss.background = rgb(null, c);
  ss.boxShadow = `0 1px 2px rgba(0,0,0,${(0.06 + 0.04 * c).toFixed(3)}), 0 12px 32px -8px rgba(0,0,0,${(0.10 + 0.04 * c).toFixed(3)})`;
  ss.transform = `scale(${(1 - 0.035 * shapePress(t)).toFixed(4)})`;
  // content lives in world coordinates; cancel the shape's own offset
  content.style.left = -(cx - w / 2) + 'px'; content.style.top = -(cy - h / 2) + 'px';
  const top = cy - h / 2;

  WASH.forEach(([t0, x0, y0], i) => {
    const x = i === 0 ? XR1 : i === 1 ? PTS[4][0] : x0, y = i === 1 ? PTS[4][1] : y0;
    const rr = 800 * clamp(S(t - t0, SP.wash));
    box(washEls[i], x, y, rr * 2, rr * 2);
    washEls[i].style.visibility = t > t0 && t < t0 + 0.5 ? 'visible' : 'hidden';
  });

  // ---- camera ----
  const z = camZ(t), camy = camY(t);
  world.style.transform = `scale(${z.toFixed(5)}) translate(0px, ${(-camy).toFixed(3)}px)`;

  // ---- button ----
  box(btn, 0, 0, 300, 84);
  show(btn, win(t, 13.58, 14.0));

  // ---- loader + check ----
  box(loader, 0, 0, 96, 96);
  if (show(loader, win(t, 0.08, 2.0), { dy: 0 })) {
    const p = clamp(loaderP(t));
    ringArc.setAttribute('stroke-dasharray', `${p.toFixed(4)} 1`);
    ringG.setAttribute('transform', `rotate(${(-90 + 250 * S(t - 0.04, { w: 3.4, z: 1 })).toFixed(2)})`);
  }
  box(loaderCheck, 0, 1, 34, 34);
  if (show(loaderCheck, win(t, 1.5, 2.0), { blur: 0, dy: 0 })) {
    const d = clamp(S(t - 1.5, SP.draw));
    loaderCheckPath.setAttribute('stroke-dasharray', '1 1');
    loaderCheckPath.setAttribute('stroke-dashoffset', (1 - d).toFixed(4));
  }

  // ---- island -> player (art and title persist) ----
  const aS = artS(t);
  box(art, artX(t), artY(t), aS, aS);
  art.style.borderRadius = artR(t) + 'px';
  show(art, win(t, 2.06, 4.5));
  boxR(title, titleX(t), titleY(t), 360, 40);
  show(title, win(t, 2.08, 4.5), { sc: titleS(t) });
  box(bars, -150, 0, 44, 30);
  if (show(bars, win(t, 2.1, 2.5))) {
    barEls.forEach((b, i) => {
      const bh = 8 + 12 * (0.5 + 0.5 * Math.sin(t * 9 + i * 1.3)) * (0.6 + 0.4 * Math.sin(t * 5.3 + i * 2.1) ** 2);
      b.style.left = (i * 9) + 'px'; b.style.top = (15 - bh / 2) + 'px'; b.style.height = bh + 'px';
    });
  }
  boxR(artist, 144, -70, 300, 28);
  show(artist, win(t, 2.6, 4.5));
  box(doneIc, -254, -124, 28, 28);
  show(doneIc, win(t, 2.64, 4.5));

  // ---- progress / volume / toggle / tabs knob ----
  const L = knobL(t), R = knobR(t), kcx = (L + R) / 2, kw = R - L;
  const kh = KD(t), ky = KY(t);
  const kc = clamp(KC(t));
  const yT = t < 7.5 ? ky : tabsY(t);
  box(knob, kcx, yT, kw, kh);
  knob.style.borderRadius = kh / 2 + 'px';
  knob.style.background = t < 7.45 ? rgb(null, kc) : '#fff';
  show(knob, win(t, 2.62, 10.5), { blur: 6, dy: 0 });
  // toggle flip without passing through grey: ink floods the track from the knob,
  // then a paper disc opens from the knob's centre; the shape turns ink under the flood
  const u = clamp(S(t - 7.06, SP.flip));
  const iw = (kw + 2) * u, ih = (kh + 2) * u;
  box(iris, kw / 2, kh / 2, iw, ih);
  iris.style.borderRadius = (ih / 2) + 'px';
  iris.style.visibility = t > 7.06 && t < 7.6 ? 'visible' : 'hidden';
  box(moonPaper, kw / 2, kh / 2, 28, 28);
  box(moonInk, iw / 2, ih / 2, 28, 28);
  const mo = win(t, 6.6, 7.5);
  moonInk.style.opacity = moonPaper.style.opacity = mo.toFixed(3);
  moonInk.style.filter = moonPaper.style.filter = mo < 0.98 ? `blur(${((1 - mo) * 6).toFixed(2)}px)` : 'none';
  moonPaper.style.visibility = t < 7.45 ? 'visible' : 'hidden';
  const fr2 = mix(kh / 2, 130, clamp(S(t - 7.0, SP.flip)));
  box(flood, kcx, yT, fr2 * 2, fr2 * 2);
  flood.style.visibility = t > 6.99 && t < 7.6 ? 'visible' : 'hidden';

  const tl = TRK_L(t), tr = TRK_R0(t) + st, ty = TRK_Y(t), th = TRK_H(t);
  const trkCol = clamp(TRKC(t)); // paper-on-ink, then ink-on-paper
  box(trk, (tl + tr) / 2, ty, tr - tl, th);
  trk.style.borderRadius = th / 2 + 'px';
  trk.style.background = `rgba(${Math.round(mix(255, 10, trkCol))},${Math.round(mix(255, 10, trkCol))},${Math.round(mix(255, 10, trkCol))},${mix(0.22, 0.1, trkCol).toFixed(3)})`;
  show(trk, win(t, 2.62, 6.5), { blur: 6, dy: 0 });
  const fr = Math.min(Math.max(kcx, tl), tr);
  box(fill, (tl + fr) / 2, ty, fr - tl, th);
  fill.style.borderRadius = th / 2 + 'px';
  fill.style.background = rgb(null, 1 - trkCol);
  show(fill, win(t, 2.62, 6.5), { blur: 6, dy: 0 });

  box(tNow, -268 + 40, 46, 80, 20);
  tNow.textContent = fmt(DUR * clamp((kcx + 268) / 536));
  show(tNow, win(t, 2.64, 4.5));
  box(tEnd, 268 - 40, 46, 80, 20);
  tEnd.textContent = '-' + fmt(DUR * (1 - clamp((kcx + 268) / 536)));
  show(tEnd, win(t, 2.64, 4.5));

  box(prevIc, -96, 112, 30, 30);
  show(prevIc, win(t, 2.68, 4.5));
  box(nextIc, 96, 112, 30, 30);
  show(nextIc, win(t, 2.68, 4.5));
  box(playBtn, 0, 112, 68, 68);
  if (show(playBtn, win(t, 2.66, 4.5), { sc: 1 - 0.08 * playPress(t) })) {
    const m = playPause(t);
    const P = (a, b) => a.map((p, i) => [mix(p[0], b[i][0], m), mix(p[1], b[i][1], m)]);
    const d = pts => 'M' + pts.map(p => p[0].toFixed(3) + ',' + p[1].toFixed(3)).join('L') + 'Z';
    pp1.setAttribute('d', d(P([[7.6, 5], [13.4, 8.5], [13.4, 15.5], [7.6, 19]], [[6.5, 5], [10.2, 5], [10.2, 19], [6.5, 19]])));
    pp2.setAttribute('d', d(P([[13.4, 8.5], [19.4, 12], [19.4, 12], [13.4, 15.5]], [[13.8, 5], [17.5, 5], [17.5, 19], [13.8, 19]])));
  }

  box(volLo, -252, 0, 28, 28);
  show(volLo, win(t, 4.62, 6.5));
  box(volHi, 252 + st, 0, 28, 28);
  show(volHi, win(t, 4.64, 6.5));


  // ---- tabs ----
  box(tabsBg, 0, tabsY(t), 540, 84);
  tabsBg.style.borderRadius = '42px';
  show(tabsBg, win(t, 9.02, 10.5), { blur: 0, dy: 0 });
  const tY = tabsY(t), tabsO = win(t, 7.58, 10.5);
  box(tabLite, 0, tY, 540, 84);
  show(tabLite, tabsO);
  box(tabInk, 0, tY, 540, 84);
  // ink labels are clipped to the liquid indicator, so the label under it turns ink exactly where it's covered
  const iTop = (yT - kh / 2) - (tY - 42), iBot = (tY + 42) - (yT + kh / 2);
  tabInk.style.clipPath = `inset(${iTop.toFixed(2)}px ${(270 - R).toFixed(2)}px ${iBot.toFixed(2)}px ${(L + 270).toFixed(2)}px round ${(kh / 2).toFixed(2)}px)`;
  show(tabInk, tabsO);

  // ---- chart ----
  boxR(chartHead, 290, -116, 300, 24);
  show(chartHead, win(t, 9.08, 10.5));
  boxR(chartNum, 290, -82, 300, 52);
  show(chartNum, win(t, 9.12, 10.5));
  box(chartSvg, 0, 70, 600, 300);
  if (show(chartSvg, win(t, 9.04, 10.5), { blur: 6, dy: 0 })) {
    cLine.setAttribute('stroke-dashoffset', (1 - clamp(S(t - 9.05, SP.line))).toFixed(4));
    const ho = win(t, 9.5, 10.5, SP.fast);
    const hx = hoverX(t), hy = hoverY(t);
    cGuide.setAttribute('x1', hx.toFixed(2)); cGuide.setAttribute('x2', hx.toFixed(2));
    cGuide.setAttribute('opacity', ho.toFixed(3));
    cDot.setAttribute('cx', hx.toFixed(2)); cDot.setAttribute('cy', hy.toFixed(2));
    cDot.setAttribute('r', (7 * ho).toFixed(2));
  }
  dayLbl.forEach((e, i) => { box(e, PTS[i][0], 206, 40, 20); show(e, win(t, 9.1 + 0.02 * i, 10.5)); });
  {
    const hx = hoverX(t), hy = hoverY(t);
    box(tip, hx, hy - 42, 148, 40);
    tip.style.transformOrigin = '50% 100%';
    show(tip, win(t, 9.5, 10.5, SP.fast), { blur: 6, dy: 6 });
    show(tipTxt[0], win(t, 9.5, 10.0, SP.enter, SP.exit), { blur: 6, dy: 0 });
    show(tipTxt[1], win(t, 10.08, 10.5), { blur: 6, dy: 0 });
  }

  // ---- command palette ----
  const iy = top + 40;
  box(srch, w / 2 - 42, iy, 26, 26);
  show(srch, win(t, 10.58, 12.5));
  boxR(placeholder, w / 2 - 70, iy, 300, 32);
  show(placeholder, win(t, 10.6, 11.5));
  box(kcap, -w / 2 + 46, iy, 48, 30);
  show(kcap, win(t, 10.62, 12.5));
  boxR(typed, w / 2 - 70, iy, 360, 32);
  if (show(typed, win(t, 11.46, 12.5), { blur: 0, dy: 0 })) {
    let last = 11.46;
    typedCh.forEach((s, i) => {
      const k = KEYS_T[i];
      if (t < k) { s.style.display = 'none'; return; }
      last = k;
      s.style.display = 'inline-block';
      const o = clamp(S(t - k, SP.key));
      s.style.opacity = o.toFixed(3);
      s.style.filter = o < 0.98 ? `blur(${((1 - o) * 5).toFixed(2)}px)` : 'none';
      s.style.transform = `translateY(${((1 - o) * 5).toFixed(2)}px)`;
    });
    caret.style.opacity = ((t - last) % 0.9) < 0.5 ? 1 : 0;
  }
  box(divider, 0, top + 80, w - 32, 1);
  show(divider, win(t, 11.04, 12.5), { blur: 0, dy: 0 });
  rows.forEach((e, i) => {
    box(e, 0, top + 116 + 56 * i, w - 16, 52);
    const sc = i === 0 ? 1 - 0.03 * enterPress(t) : 1;
    show(e, win(t, 11.06 + 0.035 * i, ROWS[i][2]), { sc, dy: 6 });
    if (e.enterCap) e.enterCap.style.background = `rgba(255,255,255,${(0.14 + 0.2 * enterPress(t)).toFixed(3)})`;
  });

  // ---- toast ----
  boxR(toastTxt, 76, 0, 300, 32);
  show(toastTxt, win(t, 12.58, 13.5));
  box(toastIc, 104, 0, 28, 28);
  if (show(toastIc, win(t, 12.58, 13.5))) {
    toastCheck.setAttribute('stroke-dasharray', '1 1');
    toastCheck.setAttribute('stroke-dashoffset', (1 - clamp(S(t - 13.0, SP.draw))).toFixed(4));
  }

  // ---- cursor, projected through the camera ----
  const sx = 720 + z * curX(t), sy = 720 + z * (curY(t) - camy);
  const cp = curPress(t);
  cursor.style.transform = `translate(${(sx - HOT[0]).toFixed(2)}px, ${(sy - HOT[1]).toFixed(2)}px) scale(${(1 - 0.12 * cp).toFixed(4)})`;
  cursor.style.transformOrigin = `${HOT[0]}px ${HOT[1]}px`;
}

window.T = T;
window.seek = seek;
window.ready = false;
document.fonts.ready.then(() => {
  seek(0);
  window.ready = true;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { seek(parseFloat(q.get('t'))); return; }
  if (q.has('render')) return;
  const t0 = performance.now();                       // preview only: drives seek, holds no state
  const loop = now => { seek((now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
